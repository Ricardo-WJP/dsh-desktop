<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      (() => {
        const preference = new URLSearchParams(location.search).get('theme')
        const media = matchMedia('(prefers-color-scheme: dark)')
        const apply = () => {
          const theme = preference === 'light' || preference === 'dark' ? preference : (media.matches ? 'dark' : 'light')
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        }
        apply()
        if (preference === 'system') media.addEventListener?.('change', apply)
      })()
    </script>
    <link rel="icon" href="../../assets/dsh-wordmark.svg" type="image/svg+xml">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
    <title>DeepSeek Harness</title>
    <style>
      :root {
        color-scheme: dark light;
        --startup-background: #151517;
        --startup-foreground: #f9fafb;
        --startup-muted: rgba(249, 250, 251, .62);
        --startup-glow: rgba(93, 111, 168, .16);
        --startup-glow-soft: rgba(185, 197, 232, .07);
        --progress-track: rgba(255, 255, 255, .14);
        --progress-start: rgba(255, 255, 255, .56);
        --progress-end: #fff;
        --progress-glow: rgba(255, 255, 255, .28);
        --startup-danger: #ff9a9d;
        font-family: "Segoe UI Variable", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --startup-background: #f3f4f6;
          --startup-foreground: #111827;
          --startup-muted: rgba(17, 24, 39, .58);
          --startup-glow: rgba(39, 48, 73, .12);
          --startup-glow-soft: rgba(39, 48, 73, .06);
          --progress-track: #dfe4eb;
          --progress-start: #657286;
          --progress-end: #111827;
          --progress-glow: rgba(17, 24, 39, .16);
          --startup-danger: #bd3442;
        }
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --startup-background: #f3f5f8;
        --startup-foreground: #111827;
        --startup-muted: rgba(17, 24, 39, .58);
        --startup-glow: rgba(39, 48, 73, .12);
        --startup-glow-soft: rgba(39, 48, 73, .06);
        --progress-track: #dfe4eb;
        --progress-start: #657286;
        --progress-end: #111827;
        --progress-glow: rgba(17, 24, 39, .16);
        --startup-danger: #bd3442;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      body { position: relative; margin: 0; min-width: 320px; color: var(--startup-foreground); background: var(--startup-background); }
      .surface { display: flex; flex-direction: column; position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--startup-background); }
      .drag-strip { position: fixed; z-index: 5; top: 0; right: 138px; left: 0; height: 36px; -webkit-app-region: drag; }
      body::before { position: fixed; right: 8%; bottom: 8%; left: 8%; height: 58%; border-radius: 50%; background: radial-gradient(ellipse 54% 42% at 50% 48%, var(--startup-glow), transparent 72%), radial-gradient(ellipse 32% 24% at 50% 48%, var(--startup-glow-soft), transparent 76%); filter: blur(28px); content: ''; pointer-events: none; }
      body::after { position: fixed; right: 18%; bottom: -28%; left: 18%; height: 46%; border-radius: 50%; background: var(--startup-glow-soft); filter: blur(74px); content: ''; pointer-events: none; }
      .startup-logo { position: absolute; z-index: 1; top: 43%; left: 50%; display: block; width: min(430px, 54vw); height: auto; filter: none; transform: translate(-50%, -50%); }
      .progress-cluster { position: fixed; z-index: 3; right: 24px; bottom: 10vh; left: 24px; display: grid; justify-items: center; }
      .progress-copy { width: min(420px, 100%); margin-bottom: 12px; }
      .progress-label { min-height: 20px; margin: 0; overflow: hidden; color: var(--startup-muted); font-size: 13px; font-weight: 500; line-height: 20px; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
      .progress { position: relative; width: min(420px, 100%); height: 3px; overflow: visible; border-radius: 99px; background: var(--progress-track); }
      .progress__fill { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: inherit; background: linear-gradient(90deg, var(--progress-start), var(--progress-end) 55%, var(--progress-start)); box-shadow: 0 1px 8px var(--progress-glow); transform: scaleX(.08); transform-origin: left center; transition: transform 240ms cubic-bezier(.22, 1, .36, 1); }
      .progress__fill::after { position: absolute; top: -1px; bottom: -1px; left: -28%; width: 28%; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--progress-end) 72%, transparent), transparent); filter: blur(.7px); opacity: .46; content: ''; animation: progress-sheen 2.35s linear infinite; }
      @keyframes progress-sheen { from { transform: translateX(0); } to { transform: translateX(460%); } }
      @media (max-width: 620px) { .startup-logo { width: min(360px, 72vw); } .progress-cluster { bottom: 9vh; } }
      @media (prefers-reduced-motion: reduce) { .progress__fill { transition: none; } .progress__fill::after { animation: none; opacity: .12; } }
    </style>
  </head>
  <body>
    <div class="drag-strip" aria-hidden="true"></div>
    <div class="surface">
      <img class="startup-logo" src="../../assets/dsh-wordmark.svg" alt="DeepSeek Harness">
      <section class="progress-cluster" aria-live="polite">
        <div class="progress-copy">
          <p class="progress-label" id="message">正在检查桌面环境…</p>
        </div>
        <div class="progress" id="progress" role="progressbar" aria-label="启动进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="8"><div class="progress__fill" id="progress-fill"></div></div>
      </section>
    </div>
    <script>
      const startupLogo = document.querySelector('.startup-logo')
      if (startupLogo) startupLogo.src = document.documentElement.dataset.theme === 'light'
        ? '../../assets/dsh-wordmark-dark.svg'
        : '../../assets/dsh-wordmark.svg'
      const query = new URLSearchParams(location.search)
      const zh = query.get('lang') !== 'en'
      const message = document.querySelector('#message')
      const progress = document.querySelector('#progress')
      const progressFill = document.querySelector('#progress-fill')
      const stages = zh ? {
        preparing: '正在检查桌面环境…',
        'launching-harness': '正在启动 Harness 核心…',
        'loading-services': '正在等待本地服务就绪…',
        'harness-ready': '正在验证服务状态…',
        'loading-workspace': '正在载入工作区…',
        complete: '工作区已就绪…',
      } : {
        preparing: 'Checking the desktop environment…',
        'launching-harness': 'Starting Harness core…',
        'loading-services': 'Waiting for local services…',
        'harness-ready': 'Verifying service readiness…',
        'loading-workspace': 'Loading the workspace…',
        complete: 'Workspace ready…',
      }
      document.documentElement.lang = zh ? 'zh-CN' : 'en'
      progress.setAttribute('aria-label', zh ? '启动进度' : 'Startup progress')
      window.setStartupState = (state = {}) => {
        const value = Math.min(100, Math.max(0, Math.round(Number(state.progress) || 0)))
        const stage = stages[state.stage] || stages.preparing
        message.textContent = stage
        progress.setAttribute('aria-valuenow', String(value))
        progress.setAttribute('aria-valuetext', `${stage} ${value}%`)
        progressFill.style.transform = `scaleX(${String(value / 100)})`
      }
      window.setStartupState({ message: query.get('message'), progress: query.get('progress') || 8, stage: query.get('stage') || 'preparing' })
    </script>
  </body>
</html>
