<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
    <title>DeepSeek Harness Desktop</title>
    <style>
      :root { color-scheme: dark light; --bg: #080c14; --ink: #f4f7fc; --muted: #a5b1c3; --subtle: #8090a8; --line: #2a3a54; --surface: #111927; --surface-soft: #0e1624; --accent: #6d8eff; --accent-strong: #5678e8; --danger: #ff9eaf; --danger-wash: #241923; --focus: #9db2ff; font-family: "Segoe UI Variable", "Segoe UI", ui-sans-serif, system-ui, sans-serif; }
      @media (prefers-color-scheme: light) { :root { --bg: #f5f6f8; --ink: #141923; --muted: #59667a; --subtle: #758196; --line: #d7dce5; --surface: #fff; --surface-soft: #eef1f5; --accent: #3f64c8; --accent-strong: #3156b6; --danger: #a43f55; --danger-wash: #fff1f4; --focus: #3156b6; } }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body { position: relative; margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: auto; padding: 56px 24px 24px; color: var(--ink); background: var(--bg); }
      body::before { position: fixed; inset: 0; background-image: radial-gradient(circle, color-mix(in srgb, var(--accent) 19%, transparent) 1px, transparent 1.2px); background-size: 26px 26px; mask-image: radial-gradient(ellipse 54% 70% at 72% 43%, #000 0%, transparent 78%); opacity: .28; content: ''; pointer-events: none; }
      body::after { position: fixed; top: 12%; right: 8%; width: 38rem; height: 38rem; border: 1px solid color-mix(in srgb, var(--accent) 13%, transparent); border-radius: 50%; opacity: .62; content: ''; pointer-events: none; }
      .drag-region { position: fixed; z-index: 5; top: 0; right: 136px; left: 0; height: 30px; -webkit-app-region: drag; }
      main { position: relative; z-index: 1; width: min(860px, 100%); padding: 18px 30px 26px; }
      .topline, .actions, .meta, .logs-row { display: flex; align-items: center; gap: 16px; }
      .topline { justify-content: space-between; }
      .wordmark { width: 218px; height: auto; }
      @media (prefers-color-scheme: light) { .wordmark { filter: invert(1); } }
      .state { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid color-mix(in srgb, var(--danger) 52%, var(--line)); border-radius: 99px; color: var(--danger); background: color-mix(in srgb, var(--danger-wash) 72%, transparent); font-size: 11px; white-space: nowrap; }
      .state-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
      .hero { max-width: 700px; margin: 94px auto 0; }
      .hero-status { display: inline-flex; align-items: center; gap: 9px; margin-bottom: 18px; color: var(--danger); font-size: 12px; font-weight: 700; letter-spacing: .02em; }
      .hero-status::before { width: 8px; height: 8px; border: 1px solid currentColor; border-radius: 50%; content: ''; }
      h1 { max-width: 700px; margin: 24px 0 16px; color: var(--ink); font-size: clamp(24px, 3vw, 36px); line-height: 1.25; letter-spacing: -.025em; }
      .summary { max-width: 650px; margin: 0; color: var(--muted); font-size: 15px; line-height: 1.7; }
      .actions { justify-content: flex-start; flex-wrap: wrap; margin-top: 24px; }
      button { min-height: 40px; padding: 8px 16px; border: 1px solid var(--accent); border-radius: 9px; color: #fff; background: var(--accent-strong); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; -webkit-app-region: no-drag; transition: transform 150ms ease, background 150ms ease, border-color 150ms ease; }
      button:hover { border-color: var(--accent); background: var(--accent); transform: translateY(-1px); }
      button:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
      button:disabled { cursor: not-allowed; opacity: .5; transform: none; }
      button.quiet { border-color: transparent; color: var(--muted); background: transparent; }
      button.quiet:hover { border-color: var(--line); background: var(--surface-soft); }
      .diagnostic { margin-top: 58px; padding: 17px 0 15px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
      .meta { justify-content: space-between; margin-bottom: 9px; color: var(--subtle); font-size: 12px; }
      .meta strong { color: var(--danger); font-size: 12px; font-weight: 650; }
      pre { max-height: 160px; overflow: auto; margin: 0; padding: 0; color: color-mix(in srgb, var(--danger) 84%, var(--ink)); white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.65 ui-monospace, SFMono-Regular, Consolas, monospace; }
      .logs-row { margin-top: 18px; justify-content: flex-start; color: var(--subtle); font-size: 12px; }
      #logs-path { color: var(--muted); overflow-wrap: anywhere; }
      #feedback { min-height: 18px; margin-top: 14px; color: var(--accent); font-size: 12px; }
      @media (max-width: 640px) { body { padding: 18px; } main { padding: 14px 10px 22px; } .topline { align-items: flex-start; flex-direction: column; gap: 18px; } .wordmark { width: 190px; } .hero { margin-top: 70px; } .diagnostic { margin-top: 44px; } }
      @media (prefers-reduced-motion: reduce) { button { transition: none; } }
    </style>
  </head>
  <body>
    <div class="drag-region" aria-hidden="true"></div>
    <main>
      <div class="topline"><img class="wordmark" src="../../assets/dsh-wordmark.svg" alt="DeepSeek Harness"><span class="state"><span class="state-dot" aria-hidden="true"></span><span id="state-label">Host 尚未就绪</span></span></div>
      <section>
        <h1 id="title">DeepSeek Harness 已停止</h1>
        <p class="summary" id="summary">本地 Harness 已停止。先重启一次；如果再次停止，再打开日志查看具体插件或运行时原因。</p>
        <div class="actions"><button id="restart" type="button">重启 Harness</button><button id="safe-mode" type="button">插件安全模式</button><button class="quiet" id="logs" type="button">打开日志</button></div>
        <div id="feedback" role="status" aria-live="polite"></div>
        <section class="diagnostic"><div class="meta"><span>最近状态</span><strong id="phase">启动已中断</strong></div><pre id="detail">Exit code: 1, signal: null</pre></section>
        <div class="logs-row"><span id="logs-label">日志位置</span><span id="logs-path">—</span></div>
      </section>
    </main>
    <script>
      const query = new URLSearchParams(location.search)
      const zh = query.get('lang') !== 'en'
      const title = query.get('title') || (zh ? 'DeepSeek Harness 已停止' : 'DeepSeek Harness stopped')
      const detail = query.get('detail') || (zh ? 'Exit code: 1, signal: null' : 'Exit code: 1, signal: null')
      const logs = query.get('logs') || '-'
      const api = window.dshDesktop
      document.documentElement.lang = zh ? 'zh-CN' : 'en'
      document.querySelector('#title').textContent = title
      document.querySelector('#detail').textContent = detail
      document.querySelector('#logs-path').textContent = logs
      document.querySelector('#logs-label').textContent = zh ? '日志位置' : 'Log location'
      document.querySelector('#restart').textContent = zh ? '重启 Harness' : 'Restart Harness'
      document.querySelector('#safe-mode').textContent = zh ? '插件安全模式' : 'Plugin safe mode'
      document.querySelector('#logs').textContent = zh ? '打开日志' : 'Open logs'
      document.querySelector('#summary').textContent = zh ? '本地 Harness 已停止。先重启一次；如果再次停止，再打开日志查看具体插件或运行时原因。' : 'The local Harness stopped. Restart it once; if it stops again, open the logs to identify the plugin or runtime cause.'
      let recovering = false
      function bindAction(id, method, message, restart = false) {
        document.querySelector(id).addEventListener('click', async () => {
          if (restart && recovering) return
          const button = document.querySelector(id)
          button.disabled = true
          if (restart) recovering = true
          try {
            const result = await api?.[method]?.()
            if (result?.ok !== true) throw new Error(result?.error || (zh ? '请求未被接受，请打开日志查看原因。' : 'Request was not accepted. Open logs for details.'))
            document.querySelector('#feedback').textContent = message
          } catch (error) {
            document.querySelector('#feedback').textContent = error?.message || String(error)
          } finally {
            button.disabled = false
            if (restart) recovering = false
          }
        })
      }
      bindAction('#restart', 'restart', zh ? '正在重新连接本地 Harness…' : 'Reconnecting to the local Harness…', true)
      bindAction('#safe-mode', 'startSafeMode', zh ? '正在临时隔离第三方插件并重新启动…' : 'Starting with third-party plugins temporarily isolated…', true)
      bindAction('#logs', 'openLogs', zh ? '正在打开日志文件夹…' : 'Opening the log folder…')
    </script>
  </body>
</html>
